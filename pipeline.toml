# laya-delegate — RTK output filtering + Laya-routed delegation to a Haiku sub-agent.
#
# Best gains (Claude Opus 5.5, SkillsBench, 48 trials per arm vs stock Claude
# Code): -30% cost on parallel-tfidf-search, -19.5% on the full suite in one
# day, -13.9% over both days, reward unchanged.
#
# NEEDS: Laya on this computer, declared below as [dependency.laya]. The
# routing decisions come from Laya (@receptron/laya, a small local classifier;
# Node 20+, ~1.7 GB model download on first start). rtk asks before installing
# it, checks the package's sha512, serves it on 127.0.0.1:41733 and starts it
# again when a tool call finds it stopped; no key is needed. Older rtk releases
# without pipeline dependencies refuse this file (E001 unknown section). Without
# Laya, every Laya-gated rule stays silent and only RTK's output filtering applies.
#
# What it does
# - Laya labels the task: bug / setup / write / data.
# - On write and data tasks, RTK refuses the agent's first looking command or
#   file read (call 2 or 3) and asks it to hand the investigation to the Explore
#   sub-agent on Haiku; the agent then works from the sub-agent's report.
# - Bug and setup tasks are left alone.
# - Whole-file reads over 350 lines that need little exact text are answered by
#   a Haiku summary (needs an Anthropic API key; skipped on subscription logins).
# - Everything else is standard RTK output filtering.
#
# Benchmark — SkillsBench, Claude Opus 5.5, 6 tasks, 4 trials per arm, run on
# two days (2026-10-18, 2026-10-19) with OFF (stock Claude Code) in the same
# batch: 48 trials per arm. Mean cost per trial, both days averaged:
#
#   task                       OFF      laya-delegate
#   parallel-tfidf-search      $1.345   $0.946   -30%
#   python-scala-translation   $1.002   $0.867   -13%
#   fix-visual-stability       $0.538   $0.448   -17%
#   fix-build-google-auto      $0.319   $0.303    -5%
#   fix-erlang-ssh-cve         $0.198   $0.191    -4%
#   debug-trl-grpo             $0.185   $0.333   +80%
#   total                      $3.587   $3.088   -13.9%   reward 0.81 -> 0.81
#
# Actions triggered over the 48 trials: 29 refusals, 28 Haiku sub-agent
# hand-offs (24 trials delegated), 77.5K tokens removed by RTK filtering
# (14% of filtered command output). Savings come from write/port tasks; on
# short bug tasks the agent's own path dominates (debug-trl-grpo: one or two long
# trials per day). Details: RESULTS.md, results.tsv.
schema_version = 1

[pipeline]
name    = "laya-delegate"
rtk_min = "1.3.0"
note    = "local AI model: needs a good GPU"
extends = ["rtk:posthook", "rtk:delegate-reads"]

[upstream.judge]
provider     = "laya"
model        = "laya"
base_url     = "http://127.0.0.1:41733/v1/systemone"
dependency   = "laya"
timeout_secs = 60

[upstream.haiku]
provider     = "anthropic"
model        = "claude-haiku-5-5"
timeout_secs = 90

[classifier.need]
upstream     = "judge"
question     = "score"
instructions = "How much of this file's exact text does the agent need for its next step?"
rubric       = ["none: a short summary is enough", "a few exact lines", "most of the file verbatim"]
input_chars  = 2000

[classifier.kind]
upstream     = "judge"
question     = "choice"
instructions = "What kind of work is this coding task?"
input_chars  = 2000
min_confidence = 0.0

[classifier.kind.labels]
bug   = "find and fix a bug by reading source code closely"
setup = "understand or repair a build, configuration, dependency or environment"
write = "write new code, a script or a port"
data  = "analyse data or files and report results"

[task.investigate]
kind         = "digest"
upstream     = "haiku"
temperature  = 0
context      = true

[task.bulk-read]
kind         = "summarize"
upstream     = "haiku"
temperature  = 0
context      = true
instructions = "You read a file for a coding agent that will NOT see it, only your reply. First answer what the agent needs for its current step, in a few terse lines, with exact identifiers. Then map the file: one line on what it is; every class, function and method with its exact signature, in file order. Then quote verbatim, grouped under the name of the function that contains them, the lines whose exact text the agent would most need for its step (non-obvious arithmetic, constants, conditions, error handling, config values). Never give line numbers. Never paraphrase code you quote. No advice, no headings. End with exactly: (Exact text: grep -n a quoted line, then Read that file with offset and limit, at most 350 lines.)"

[override.shunt-large-read]
enabled = false

[[hook.before_tool.read]]
name   = "answer-big-reads"
when   = { file_lines_gt = 350, whole_file = true, "score.need_lte" = 0.65 }
action = "route"
task   = "bulk-read"
mode   = "answer"

[[directive]]
name = "explore-in-subagent"
text = """
When RTK asks you to hand an investigation to the Explore sub-agent, call it on the haiku model (Agent tool: subagent_type "Explore", model "haiku") with one precise question built from the task, ask it for file paths, line numbers and the exact lines you will need, and work from its report instead of repeating its searches.
"""

[[hook.before_tool.shell]]
name    = "delegate-investigation"
when    = { command_matches = "^(cd [^;&]+(;|&&) *)?(ls|cat|head|tail|grep|rg|find|tree|pwd|echo|which|wc|file|stat|du|for|while|awk|nl|xxd|git|sed -n)\\b", recent_calls_matches = "^(Bash|Read|Grep|Glob) [^|]*( \\| (Bash|Read|Grep|Glob) [^|]*)?$", "class.kind_in" = ["write", "data"] }
action  = "route"
task    = "investigate"
mode    = "suggest"
message = "Do not run this search or open these files yourself: hand the investigation to the Explore sub-agent (Agent tool: subagent_type \"Explore\", model \"haiku\") with one precise question, and ask it for file paths, line numbers and the exact lines you will need. Then work from its report."

[[hook.before_tool.read]]
name    = "delegate-investigation-read"
when    = { recent_calls_matches = "^(Bash|Read|Grep|Glob) [^|]*( \\| (Bash|Read|Grep|Glob) [^|]*)?$", "class.kind_in" = ["write", "data"] }
action  = "route"
task    = "bulk-read"
mode    = "suggest"
message = "Do not run this search or open these files yourself: hand the investigation to the Explore sub-agent (Agent tool: subagent_type \"Explore\", model \"haiku\") with one precise question, and ask it for file paths, line numbers and the exact lines you will need. Then work from its report."

# Laya runs on this computer, installed only after you say yes. rtk checks
# the package's sha512 before anything runs, serves it on 127.0.0.1:41733
# with the server below, and it exits after 30 idle minutes.
[dependency.laya]
about     = "Laya, an open-source decision model the judge asks"
needs     = "a computer with a good GPU (it runs an AI model locally; slower machines will struggle), Node.js 20+, ~1.7 GB of model weights downloaded on first start (kept in ~/.cache/receptron-laya), ~2 GB of RAM while running"
npm       = "@receptron/laya@0.2.0"
integrity = "sha512-C7eBcUUj/S4Mn2ccQoqflZghEi9OPu6RBUbSjcbnuPbQQAWTVFGxDRoLyyP59hm2t4oF8JbE+dP0IaUE58XsJQ=="
node      = 20
run       = ["node", "server.mjs"]
listen    = "127.0.0.1:41733"
health    = "/health"
env       = { LAYA_PORT = "41733", LAYA_IDLE_SECS = "1800", ONNXRUNTIME_NODE_INSTALL = "skip" }

[dependency.laya.files]
"server.mjs" = '''
import { createServer } from "node:http";
import { Laya } from "@receptron/laya";

const PORT = Number(process.env.LAYA_PORT ?? 41733);
const HOST = process.env.LAYA_HOST ?? "127.0.0.1";
const IDLE_SECS = Number(process.env.LAYA_IDLE_SECS ?? 1800);
const state = { phase: "loading", file: "", received: 0, total: 0 };
let laya = null;
let lastUse = Date.now();
let logged = { file: "", pct: -10 };

const server = createServer((req, res) => {
  if (req.method === "GET" && req.url === "/health") {
    if (laya) return res.end("ok");
    const pct = state.total ? Math.floor((state.received / state.total) * 100) : 0;
    res.statusCode = 503;
    return res.end(state.phase === "downloading" ? `downloading ${state.file} ${pct}%` : "loading the model");
  }
  if (req.method !== "POST" || !req.url.startsWith("/v1/systemone")) {
    res.statusCode = 404;
    return res.end();
  }
  if (!laya) {
    res.statusCode = 503;
    return res.end(JSON.stringify({ error: "loading" }));
  }
  lastUse = Date.now();
  let body = "";
  req.setEncoding("utf8");
  req.on("data", (c) => { body += c; if (body.length > 1_000_000) req.destroy(); });
  req.on("end", async () => {
    try {
      const { state: input, questions } = JSON.parse(body);
      const t0 = Date.now();
      const result = await laya.systemOne(input ?? "", questions ?? {});
      const answers = {};
      for (const [name, a] of Object.entries(result.answers)) {
        if (a.type === "score") {
          const levels = Object.keys(a.probabilities ?? {}).length;
          answers[name] = { ...a, score: levels > 1 ? a.score / (levels - 1) : a.score };
        } else answers[name] = a;
      }
      console.log(`laya: verdict ${Date.now() - t0}ms chars=${(input ?? "").length}`);
      res.setHeader("content-type", "application/json");
      res.end(JSON.stringify({ model: result.model, answers, usage: result.usage }));
    } catch (e) {
      console.error("laya: request failed", e);
      res.statusCode = 400;
      res.end(JSON.stringify({ error: "Bad request" }));
    }
  });
});
server.on("error", (e) => {
  console.error(`laya: cannot listen on ${HOST}:${PORT}: ${e.message}`);
  process.exit(1);
});
server.listen(PORT, HOST, () => console.log(`laya: listening on ${HOST}:${PORT}/v1/systemone`));

try {
  laya = await Laya.load({
    onProgress: ({ file, received, total }) => {
      state.phase = "downloading";
      state.file = file;
      state.received = received;
      state.total = total;
      const pct = total ? Math.floor((received / total) * 100) : 0;
      if (file !== logged.file || pct >= logged.pct + 10) {
        logged = { file, pct };
        console.log(`laya: downloading ${file} ${pct}%`);
      }
    },
  });
} catch (e) {
  console.error("laya: model failed to load", e);
  process.exit(1);
}
state.phase = "ready";
lastUse = Date.now();
console.log("laya: model warm");

if (IDLE_SECS > 0) {
  setInterval(() => {
    if (Date.now() - lastUse > IDLE_SECS * 1000) {
      console.log(`laya: idle ${IDLE_SECS}s, exiting`);
      process.exit(0);
    }
  }, 60000).unref();
}
'''
